name: Predict

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Sync stream and generate cycle predictions
        run: |
          python - <<'PY'
          from cycle_predictions import SupabaseCyclePredictionStore, generate_cycle_predictions
          from forecast_cycle_sync import PulsoForecastCycleApi
          from stream_sync import PulsoStreamApi, SupabaseRestObservationStore, sync_observation_stream

          with PulsoStreamApi() as stream_api, SupabaseRestObservationStore() as observation_store:
              sync_observation_stream(stream_api, observation_store)

          with PulsoForecastCycleApi() as cycle_api, SupabaseCyclePredictionStore() as prediction_store:
              result = generate_cycle_predictions(cycle_api, prediction_store)

          print(
              "predict complete: "
              f"status={result.status} "
              f"cycle_id={result.cycle_id} "
              f"expected_predictions={result.expected_predictions} "
              f"predictions_generated={result.predictions_generated} "
              "submission_post=not_executed"
          )
          PY
