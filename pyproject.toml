[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulso-transmi"
version = "0.1.0"
description = "SDK estudiantil para el reto MLOps Pulso TransMi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.28,<1",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
ml = [
  "jupyter>=1,<2",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "tabulate>=0.9,<1",
]
dev = ["pytest>=8,<9"]
tracking = ["mlflow==3.5.1", "sqlalchemy==2.0.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
